name: Model Quality & Regression Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval-regression-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Baseline Evaluation
      run: |
        # Generate baseline run first to serve as base
        python main.py --model mock --prompt-version baseline

    - name: Run PR Regression Check
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        # Run test. If model or prompt regression is found, exits with 1 and fails build
        python main.py --model mock --prompt-version PR_check

    - name: Upload Run History Database
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: eval_history_db
        path: db/eval_history.db
